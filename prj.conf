CONFIG_GPIO=y
CONFIG_SERIAL=y
CONFIG_CONSOLE=y

# Logging
CONFIG_LOG=n
CONFIG_PRINTK=y
CONFIG_BOOT_BANNER=n

CONFIG_SENSOR=y

# Configuration des capteurs de l'extension X-NUCLEO-IKS4A1
CONFIG_I2C=y
CONFIG_LSM6DSO16IS=y
CONFIG_LIS2MDL=y
CONFIG_LPS2XDF=y

# GNSS1A1 (Teseo-LIV3F, NMEA sur USART1)
CONFIG_UART_INTERRUPT_DRIVEN=y

# Sous-système GNSS Zephyr et parseur NMEA générique
CONFIG_GNSS=y
CONFIG_GNSS_NMEA_GENERIC=y

# micro-ROS Jazzy over USART3 to the ROS 2 agent on the SBC.
CONFIG_MICROROS=y
CONFIG_APP_LINK_WITH_MICROROS=y
CONFIG_MICROROS_TRANSPORT_SERIAL=y
CONFIG_MICROROS_NODES="1"
CONFIG_MICROROS_PUBLISHERS="6"
CONFIG_MICROROS_SUBSCRIBERS="1"
CONFIG_MICROROS_XRCE_DDS_MTU="512"
CONFIG_MICROROS_XRCE_DDS_HISTORIC="4"
CONFIG_MICROROS_RMW_HISTORIC="4"

CONFIG_UART_LINE_CTRL=y
CONFIG_POSIX_API=y
CONFIG_STATIC_INIT_GNU=y