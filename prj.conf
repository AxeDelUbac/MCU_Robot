CONFIG_GPIO=y
CONFIG_SERIAL=y
CONFIG_CONSOLE=y

# Logging
CONFIG_LOG=y
CONFIG_LOG_DEFAULT_LEVEL=3

CONFIG_SENSOR=y

#configuration for the IMU
CONFIG_I2C=y
# Enable LSM6 & MMC56X3 drivers and increase sensor/I2C debug for diagnosis
CONFIG_LSM6DSL=y
CONFIG_MMC56X3=y
# Set default ODR to 104 Hz (use integer values only)
CONFIG_LSM6DSL_ACCEL_ODR=4
CONFIG_LSM6DSL_GYRO_ODR=4
CONFIG_SENSOR_LOG_LEVEL_DBG=y
CONFIG_I2C_LOG_LEVEL_DBG=y

# Environmental sensor (BME680: temp, humidity, pressure, gas/IAQ)
CONFIG_BME680=y

# Light sensor (BH1750: luminosity in lux)
CONFIG_BH1750=y

# Configuration for the GPS
CONFIG_UART_INTERRUPT_DRIVEN=y

# Use Zephyr GNSS subsystem and generic NMEA parser
CONFIG_GNSS=y
CONFIG_GNSS_NMEA_GENERIC=y